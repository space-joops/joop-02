<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="궤도 띠">
  <!--
    궤도 띠 · 별(starfield) 위, 쓰레기(debris) 아래 레이어 (z-orbit 토큰)
    스크롤 느낌은 이 그룹 전체를 느리게 translate 해서 냅니다.
  -->
  <defs>
    <linearGradient id="orbit-band-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--color-bg-orbit, #1b2450)" stop-opacity="0"/>
      <stop offset="35%" stop-color="var(--color-bg-orbit, #1b2450)" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="var(--color-bg-orbit, #1b2450)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--color-bg-orbit, #1b2450)" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbit-nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--color-bg-nebula, #4a2e9e)" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="var(--color-bg-nebula, #4a2e9e)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="220" rx="210" ry="170" fill="url(#orbit-nebula)"/>
  <ellipse cx="310" cy="620" rx="180" ry="150" fill="url(#orbit-nebula)" opacity="0.7"/>

  <g id="orbit-lines" fill="none" stroke="url(#orbit-band-fade)" stroke-linecap="round">
    <path d="M-40 180 C120 120 280 240 440 180" stroke-width="26"/>
    <path d="M-40 400 C120 340 280 460 440 400" stroke-width="18" opacity="0.75"/>
    <path d="M-40 620 C120 560 280 680 440 620" stroke-width="30" opacity="0.6"/>
  </g>
</svg>
