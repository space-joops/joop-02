<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="줍스">
  <!--
    파비콘 · 32px 기준으로 다시 그린 버전입니다. 로고를 축소한 것이 아닙니다.
    이 크기에서는 수염·가시·그라디언트가 전부 뭉개지므로 귀 + 바이저 + 눈만 남깁니다.
