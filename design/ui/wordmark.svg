<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" role="img" aria-label="줍스 — 반려위성 우주청소">
  <!--
    워드마크

    ⚠️ 한글 글자를 <text> 로 두었습니다. 즉 **보는 기기에 설치된 폰트에 따라 모양이 달라집니다.**
       확정된 폰트가 없어서 아웃라인(패스)으로 변환하지 않았습니다.
       폰트를 정하면 글자를 패스로 변환해 이 파일을 교체하세요. 그 전까지는 임시 버전입니다.
  -->
  <g transform="translate(6 6)">
    <!-- 미니 마크 -->
    <g>
      <path d="M17 12 L20 1 L27 8 Z" fill="var(--color-shell-edge, #b2c1d8)"/>
      <path d="M43 12 L40 1 L33 8 Z" fill="var(--color-shell-edge, #b2c1d8)"/>
      <ellipse cx="30" cy="30" rx="22" ry="19" fill="var(--color-shell-hi, #ffffff)"/>
      <rect x="13" y="22" width="34" height="17" rx="8.5" fill="var(--color-visor, #0b1120)"/>
      <g fill="var(--color-eye, #6fe3ff)">
        <ellipse cx="23" cy="30.5" rx="4.4" ry="5.4"/>
        <ellipse cx="37" cy="30.5" rx="4.4" ry="5.4"/>
      </g>
    </g>
  </g>

  <text x="72" y="40" font-family="var(--font-ui, sans-serif)" font-size="34"
    font-weight="700" letter-spacing="1" fill="var(--color-text-hi, #f2f6ff)">줍스</text>
  <text x="74" y="60" font-family="var(--font-ui, sans-serif)" font-size="12"
    letter-spacing="2.4" fill="var(--color-text-low, #8b99bc)">반려위성 우주청소</text>
</svg>
