<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="[제안] 케이블형 줍스 액센트">
  <!--
    ⚠️ 제안(proposal)입니다. 확정된 디자인이 아닙니다. (roadmap.md M6에서 결론)
    사용 방식: joops-base.svg 위에 겹치는 액센트 레이어 단독. 몸체를 복사하지 않습니다.

    케이블형 — 전선 선호 / 장난기 많음 / 케이블이 표정처럼 움직임
    #cable-left / #cable-right 를 각각 흔들면 기분에 따라 움직이는 연출이 됩니다.
    (기본 수염 와이어 joops-whiskers 는 그대로 두고 그 위에 겹칩니다)
  -->
  <g id="type-cable-accent" fill="none"
     stroke="var(--color-debris-cable, #e89c3c)" stroke-width="3.2" stroke-linecap="round">
    <g id="cable-left">
      <path d="M52 92 C34 88 20 96 14 110 C10 120 18 128 26 124"/>
      <circle cx="27" cy="123" r="4" fill="var(--color-debris-cable-hi, #ffd08a)" stroke="none"/>
    </g>
    <g id="cable-right">
      <path d="M148 92 C166 88 180 96 186 110 C190 120 182 128 174 124"/>
      <circle cx="173" cy="123" r="4" fill="var(--color-debris-cable-hi, #ffd08a)" stroke="none"/>
    </g>
    <!-- 머리 위로 삐친 케이블 한 가닥 -->
    <path d="M104 36 C110 22 124 22 126 32" stroke-width="3"/>
    <circle cx="126" cy="33" r="3.4" fill="var(--color-debris-cable-hi, #ffd08a)" stroke="none"/>
  </g>
</svg>
